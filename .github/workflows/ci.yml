name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Mock-data evaluation
        run: python scripts/eval_queries.py
      - name: Static security scan
        run: bandit -q -r src scripts packaging
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable
