[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "designfinder"
version = "0.1.0"
requires-python = ">=3.11"
# headless: we never use OpenCV's own windows, and it keeps the .exe smaller
dependencies = ["opencv-python-headless", "numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "pip-audit", "bandit", "pyinstaller"]

[project.gui-scripts]
designfinder-gui = "designfinder.bubble:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
